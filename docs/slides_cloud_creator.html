<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net https://d3js.org; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data: blob: https://source.unsplash.com https://images.unsplash.com https://cdn.openai.com https://oaidalleapiprodscus.blob.core.windows.net https://api.stability.ai; connect-src 'self' https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com https://api.stability.ai; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;">
    <title>Cloud AI Slides Creator</title>
    <link rel="stylesheet" href="./assets/stylesheets/extra.css" />
</head>
<body>
    <div class="container">
        <h1>Cloud AI Slides Creator</h1>
        <div id="ai-status" class="ai-status-initial"></div>

        <!-- Provider-specific section will be injected here -->
        <div id="provider-section"></div>

        <fieldset>
            <legend>Presentation Generator</legend>

            <div class="input-group">
                <label for="presentation-topic">Presentation Topic</label>
                <textarea id="presentation-topic" placeholder="e.g., 'The Future of Artificial Intelligence in Healthcare'" class="prompt-textarea-large" required></textarea>
            </div>

            <div class="input-group">
                <label for="num-slides" class="label-no-shrink-no-margin">Number of Slides:</label>
                <select id="num-slides" class="select-no-margin">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="8" selected>8</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                    <option value="15">15</option>
                </select>
                <button type="button" id="generate-slides-btn" class="btn btn-primary margin-left-1rem">Generate Presentation</button>
            </div>

            <div id="generation-status" class="status-display"></div>
        </fieldset>

        <hr class="hr-margin">

        <!-- Slides Preview Section -->
        <div id="presentation-section" style="display: block;">
            <!-- Slides Preview -->
            <div id="slides-preview" class="slides-container">
                <!-- Slides will be inserted here -->
            </div>

            <!-- Export Section (hidden - handled by JavaScript) -->
            <div class="export-options" style="display: none;">
                <div id="export-status" class="status-display"></div>
            </div>
        </div>

        <!-- Hidden presentation viewer -->
        <div id="presentation-viewer" style="display: none;">
            <div style="text-align: center; margin: 20px 0;">
                <button type="button" id="close-presentation-btn" class="btn btn-secondary">× Close Presentation</button>
            </div>
            <div id="reveal-presentation" class="reveal">
                <div class="slides">
                    <!-- Reveal.js slides will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Export Modal -->
        <div id="export-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
            <div class="modal-content" style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 90%; max-width: 500px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0;">Export Presentation</h3>
                    <button type="button" id="close-export-modal-btn" style="background: none; border: none; font-size: 1.5em; cursor: pointer; padding: 5px;">×</button>
                </div>

                <!-- Export Options -->
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; margin-bottom: 10px;">
                        <input type="checkbox" id="include-speaker-notes" style="margin-right: 8px;">
                        Include speaker notes in export
                    </label>
                </div>

                <!-- Export Buttons -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <button type="button" id="export-pdf-btn" class="btn btn-primary">⟄ PDF</button>
                    <button type="button" id="export-pptx-btn" class="btn btn-primary">⟐ PowerPoint</button>
                    <button type="button" id="export-html-btn" class="btn btn-secondary">◰ HTML</button>
                    <button type="button" id="export-json-btn" class="btn btn-outline">{} JSON Data</button>
                </div>

                <div id="export-modal-status" class="status-display" style="margin-top: 15px;"></div>
            </div>
        </div>
    </div>

    <!-- Security and Common Utilities (loaded first) -->
    <script src="./assets/javascripts/security.js"></script>
    <script src="./assets/javascripts/creator-common.js"></script>

    <!-- Slide-specific Modules -->
    <script type="module" src="./assets/javascripts/slides-common.js"></script>
    <script type="module" src="./assets/javascripts/slides-components.js"></script>
    <script type="module" src="./assets/javascripts/slides-konva-integration.js"></script>
    <script type="module" src="./assets/javascripts/konva-core.js"></script>
    <script type="module" src="./assets/javascripts/konva-components.js"></script>

    <!-- Provider Integration -->
    <script type="module" src="./assets/javascripts/cloud-creator.js"></script>

    <!-- External Libraries (lazy loaded) -->
    <script>
        // Configure provider type
        window.COURSE_CREATOR_PROVIDER = 'cloud';

        // Initialize slide creator when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Lazy load external libraries only when needed
            const libs = [
                './assets/js/jszip/3.10.1/jszip.min.js',
                'https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js',
                'https://unpkg.com/html2canvas@latest/dist/html2canvas.min.js',
                'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
                'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.js',
                'https://d3js.org/d3.v7.min.js',
                'https://unpkg.com/lucide@latest/dist/umd/lucide.js'
            ];

            // Load libraries in parallel
            const loadPromises = libs.map(src => {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            });

            try {
                await Promise.all(loadPromises);
                console.log('External libraries loaded successfully');
            } catch (error) {
                console.warn('Some external libraries failed to load:', error);
            }
        });
    </script>
</body>
</html>
