<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides Creator - Choose Your AI Provider</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Load CSS files in dependency order (replaces bundle for better debugging) -->
    <link rel="stylesheet" href="./assets/css/core/variables.css">
    <link rel="stylesheet" href="./assets/css/core/reset.css">
    <link rel="stylesheet" href="./assets/css/core/typography.css">
    <link rel="stylesheet" href="./assets/css/layouts/containers.css">
    <link rel="stylesheet" href="./assets/css/layouts/grid.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/forms.css">
    <link rel="stylesheet" href="./assets/css/components/cards.css">
    <link rel="stylesheet" href="./assets/css/components/modals.css">
    <link rel="stylesheet" href="./assets/css/components/status.css">
    <link rel="stylesheet" href="./assets/css/components/launcher.css">
    <link rel="stylesheet" href="./assets/css/components/puter.css">
    <link rel="stylesheet" href="./assets/css/components/icons.css">
    <link rel="stylesheet" href="./assets/css/components/tabs.css">
    <link rel="stylesheet" href="./assets/css/components/konva-components.css">
    <link rel="stylesheet" href="./assets/css/components/modal-system.css">
    <link rel="stylesheet" href="./assets/css/components/accordion-toolbar.css">
    <link rel="stylesheet" href="./assets/css/core/utilities.css">
    <link rel="stylesheet" href="./assets/css/responsive/mobile.css">
    <link rel="stylesheet" href="./assets/css/themes/light.css">
    <link rel="stylesheet" href="./assets/css/themes/dark.css">
    <script src="./assets/js/theme-manager.js"></script>
</head>
<body class="text-minimal">
    <div class="main-container">
        <a href="index.html" class="btn btn-ghost mb-4">
            ← Back to Creator Hub
        </a>

        <h1 class="mb-4">
            <span class="icon-slides-css mr-2"></span> AI Slides Creator
        </h1>
        <p class="text-secondary mb-6">Create beautiful, AI-powered presentations with visual elements. Choose your preferred AI provider below:</p>

        <div class="provider-selector">
            <div class="provider-row">
                <div class="provider-tabs">
                    <div class="provider-tab" data-provider="openrouter">
                        <span class="icon-cloud-css"></span>
                        <span>OpenRouter</span>
                    </div>
                    <div class="provider-tab" data-provider="webllm">
                        <span class="icon-rocket-css"></span>
                        <span>WebLLM</span>
                    </div>
                    <div class="provider-tab" data-provider="ollama">
                        <span class="icon-desktop-css"></span>
                        <span>Ollama</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="creator-container">
            <div class="loading-state">
                <div class="status-with-icon">
                    <span class="status-icon">
                        <span class="icon-point-css"></span>
                    </span>
                    <span>Select an AI provider above to get started</span>
                </div>
                <p class="text-secondary mt-2">Each provider offers different capabilities for creating engaging presentations.</p>
            </div>
        </div>
    </div>

    <script>
        const providerTabs = document.querySelectorAll('.provider-tab');
        const creatorContainer = document.getElementById('creator-container');

        const providerUrls = {
            openrouter: 'slides_openrouter.html',
            webllm: 'slides_webllm.html',
            ollama: 'slides_ollama.html'
        };

        function resizeIframe(iframe) {
            try {
                // Wait for iframe to load, then resize
                iframe.onload = function() {
                    try {
                        // Get the height of the iframe's content
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        const height = Math.max(
                            iframeDoc.body.scrollHeight,
                            iframeDoc.body.offsetHeight,
                            iframeDoc.documentElement.clientHeight,
                            iframeDoc.documentElement.scrollHeight,
                            iframeDoc.documentElement.offsetHeight
                        );

                        // Set the iframe height with some padding
                        iframe.style.height = (height + 50) + 'px';

                        // Also listen for content changes
                        const observer = new MutationObserver(() => {
                            setTimeout(() => {
                                const newHeight = Math.max(
                                    iframeDoc.body.scrollHeight,
                                    iframeDoc.body.offsetHeight,
                                    iframeDoc.documentElement.clientHeight,
                                    iframeDoc.documentElement.scrollHeight,
                                    iframeDoc.documentElement.offsetHeight
                                );
                                iframe.style.height = (newHeight + 50) + 'px';
                            }, 100);
                        });

                        observer.observe(iframeDoc.body, {
                            childList: true,
                            subtree: true,
                            attributes: true
                        });
                    } catch (e) {
                        // Cross-origin restrictions - use fallback height
                        iframe.style.height = '1400px';
                    }
                };
            } catch (e) {
                // Fallback if iframe resizing fails
                iframe.style.height = '1400px';
            }
        }

        function showProvider(provider) {
            // Update tab states
            providerTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.provider === provider);
            });


            // Load provider in iframe
            const iframe = document.createElement('iframe');
            iframe.src = providerUrls[provider];
            iframe.className = 'creator-frame';
            iframe.title = `${provider} Slides Creator`;

            // Auto-resize iframe based on content
            resizeIframe(iframe);

            // Clear container and add iframe
            creatorContainer.innerHTML = '';
            creatorContainer.appendChild(iframe);

            // Store selection
            localStorage.setItem('lastSlidesProvider', provider);
        }

        // Add click listeners
        providerTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const provider = tab.dataset.provider;
                showProvider(provider);
            });
        });

        // Restore last selection
        const lastProvider = localStorage.getItem('lastSlidesProvider');
        if (lastProvider && providerUrls[lastProvider]) {
            showProvider(lastProvider);
        }
    </script>
</body>
</html>
