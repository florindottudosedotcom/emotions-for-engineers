<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refactor Validation Test</title>
    <!-- Load CSS files in dependency order (replaces bundle for better debugging) -->
    <link rel="stylesheet" href="./assets/css/core/variables.css">
    <link rel="stylesheet" href="./assets/css/core/reset.css">
    <link rel="stylesheet" href="./assets/css/core/typography.css">
    <link rel="stylesheet" href="./assets/css/layouts/containers.css">
    <link rel="stylesheet" href="./assets/css/layouts/grid.css">
    <link rel="stylesheet" href="./assets/css/components/buttons.css">
    <link rel="stylesheet" href="./assets/css/components/forms.css">
    <link rel="stylesheet" href="./assets/css/components/cards.css">
    <link rel="stylesheet" href="./assets/css/components/modals.css">
    <link rel="stylesheet" href="./assets/css/components/status.css">
    <link rel="stylesheet" href="./assets/css/components/launcher.css">
    <link rel="stylesheet" href="./assets/css/components/puter.css">
    <link rel="stylesheet" href="./assets/css/components/icons.css">
    <link rel="stylesheet" href="./assets/css/core/utilities.css">
    <link rel="stylesheet" href="./assets/css/responsive/mobile.css">
    <link rel="stylesheet" href="./assets/css/themes/light.css">
    <link rel="stylesheet" href="./assets/css/themes/dark.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }
        .test-result {
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: var(--border-radius);
            font-family: monospace;
        }
        .test-pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .test-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Refactor Validation Test</h1>
        <p>Testing if the refactored modular architecture loads correctly...</p>

        <div id="test-results"></div>

        <button id="run-tests" class="btn btn-primary">Run Tests</button>
    </div>

    <script type="module">
        const results = document.getElementById('test-results');
        const runBtn = document.getElementById('run-tests');

        function addResult(test, status, message) {
            const div = document.createElement('div');
            div.className = `test-result test-${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
        }

        async function runTests() {
            results.innerHTML = '';
            addResult('Starting Tests', 'pending', 'Running validation tests...');

            // Test 1: CSS Loading
            try {
                const styles = getComputedStyle(document.body);
                const hasThemeVars = styles.getPropertyValue('--primary-color');
                if (hasThemeVars) {
                    addResult('CSS Architecture', 'pass', 'CSS variables loaded successfully');
                } else {
                    addResult('CSS Architecture', 'fail', 'CSS variables not found');
                }
            } catch (error) {
                addResult('CSS Architecture', 'fail', `Error: ${error.message}`);
            }

            // Test 2: Core Utils
            try {
                const { logger, debounce } = await import('./assets/js/core/utils.js');
                if (logger && debounce) {
                    addResult('Core Utils', 'pass', 'Utils module loaded successfully');
                } else {
                    addResult('Core Utils', 'fail', 'Utils module missing functions');
                }
            } catch (error) {
                addResult('Core Utils', 'fail', `Import error: ${error.message}`);
            }

            // Test 3: DOM Utils
            try {
                const { DOM, Events } = await import('./assets/js/core/dom.js');
                if (DOM && Events && DOM.create) {
                    addResult('DOM Utils', 'pass', 'DOM utilities loaded successfully');
                } else {
                    addResult('DOM Utils', 'fail', 'DOM utilities missing functions');
                }
            } catch (error) {
                addResult('DOM Utils', 'fail', `Import error: ${error.message}`);
            }

            // Test 4: State Management
            try {
                const { appState } = await import('./assets/js/core/state.js');
                if (appState && appState.get && appState.set) {
                    addResult('State Management', 'pass', 'State manager loaded successfully');
                } else {
                    addResult('State Management', 'fail', 'State manager missing functions');
                }
            } catch (error) {
                addResult('State Management', 'fail', `Import error: ${error.message}`);
            }

            // Test 5: Base Provider
            try {
                const { BaseProvider } = await import('./assets/js/providers/BaseProvider.js');
                if (BaseProvider && BaseProvider.prototype.generateText) {
                    addResult('Base Provider', 'pass', 'Base provider class loaded successfully');
                } else {
                    addResult('Base Provider', 'fail', 'Base provider missing methods');
                }
            } catch (error) {
                addResult('Base Provider', 'fail', `Import error: ${error.message}`);
            }

            // Test 6: Cloud Provider
            try {
                const { CloudProvider } = await import('./assets/js/providers/CloudProvider.js');
                if (CloudProvider) {
                    addResult('Cloud Provider', 'pass', 'Cloud provider loaded successfully');
                } else {
                    addResult('Cloud Provider', 'fail', 'Cloud provider not found');
                }
            } catch (error) {
                addResult('Cloud Provider', 'fail', `Import error: ${error.message}`);
            }

            // Test 7: UI Manager
            try {
                const { UIManager } = await import('./assets/js/components/UIManager.js');
                if (UIManager) {
                    addResult('UI Manager', 'pass', 'UI Manager loaded successfully');
                } else {
                    addResult('UI Manager', 'fail', 'UI Manager not found');
                }
            } catch (error) {
                addResult('UI Manager', 'fail', `Import error: ${error.message}`);
            }

            // Test 8: Course Manager
            try {
                const { CourseManager } = await import('./assets/js/creators/CourseManager.js');
                if (CourseManager) {
                    addResult('Course Manager', 'pass', 'Course Manager loaded successfully');
                } else {
                    addResult('Course Manager', 'fail', 'Course Manager not found');
                }
            } catch (error) {
                addResult('Course Manager', 'fail', `Import error: ${error.message}`);
            }

            // Test 9: Theme Manager
            try {
                const { ThemeManager } = await import('./assets/js/core/theme.js');
                if (ThemeManager) {
                    const themeManager = new ThemeManager();
                    addResult('Theme Manager', 'pass', 'Theme Manager instantiated successfully');
                } else {
                    addResult('Theme Manager', 'fail', 'Theme Manager not found');
                }
            } catch (error) {
                addResult('Theme Manager', 'fail', `Import error: ${error.message}`);
            }

            addResult('Tests Complete', 'pending', 'All validation tests completed.');
        }

        runBtn.addEventListener('click', runTests);

        // Auto-run tests on load
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
