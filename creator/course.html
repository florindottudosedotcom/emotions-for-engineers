    <!-- Preload critical assets -->
    <link rel="preload" href="./assets/js/main.js" as="script">
    <link rel="preload" href="./assets/js/core/utils.js" as="script">
    <link rel="preload" href="./assets/js/core/dom.js" as="script">
    <link rel="preload" href="./assets/js/core/state.js" as="script">

    <!-- Load non-critical CSS asynchronously -->
    <link rel="preload" href="./assets/css/bundle.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="./assets/css/bundle.min.css"></noscript>

<body class="text-minimal">
    <div class="main-container" style="max-width: none; padding: 1rem 2rem;">
        <a href="index.html" class="back-button">
            ← Back to Creator Hub
        </a>


        <div class="provider-selector">
            <div class="provider-row">
                <div class="provider-tabs">
                    <div class="provider-tab" data-provider="puter">
                        <span class="icon-rocket-css"></span>
                        <span>Free AI</span>
                    </div>
                    <div class="provider-tab" data-provider="cloud">
                        <span class="icon-cloud-css"></span>
                        <span>Cloud AI</span>
                    </div>
                    <div class="provider-tab" data-provider="webllm">
                        <span class="icon-brain-css"></span>
                        <span>WebLLM</span>
                    </div>
                    <div class="provider-tab" data-provider="ollama">
                        <span class="icon-desktop-css"></span>
                        <span>Ollama</span>
                    </div>
                </div>

            </div>
        </div>

        <div id="creator-container">
            <div class="loading-state">
                <div><span class="icon-point-css"></span> Select an AI provider above to get started</div>
                <p>Each provider offers different advantages - choose the one that best fits your needs.</p>
            </div>
        </div>
    </div>

    <script>
        const providerTabs = document.querySelectorAll('.provider-tab');
        const creatorContainer = document.getElementById('creator-container');

        const providerUrls = {
            puter: 'puter.html',
            cloud: 'cloud.html',
            webllm: 'webllm.html',
            ollama: 'ollama.html'
        };

        function resizeIframe(iframe) {
            try {
                // Wait for iframe to load, then resize
                iframe.onload = function() {
                    try {
                        // Get the height of the iframe's content
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        const height = Math.max(
                            iframeDoc.body.scrollHeight,
                            iframeDoc.body.offsetHeight,
                            iframeDoc.documentElement.clientHeight,
                            iframeDoc.documentElement.scrollHeight,
                            iframeDoc.documentElement.offsetHeight
                        );

                        // Set the iframe height with some padding
                        iframe.style.height = (height + 50) + 'px';

                        // Also listen for content changes
                        const observer = new MutationObserver(() => {
                            setTimeout(() => {
                                const newHeight = Math.max(
                                    iframeDoc.body.scrollHeight,
                                    iframeDoc.body.offsetHeight,
                                    iframeDoc.documentElement.clientHeight,
                                    iframeDoc.documentElement.scrollHeight,
                                    iframeDoc.documentElement.offsetHeight
                                );
                                iframe.style.height = (newHeight + 50) + 'px';
                            }, 100);
                        });

                        observer.observe(iframeDoc.body, {
                            childList: true,
                            subtree: true,
                            attributes: true
                        });
                    } catch (e) {
                        // Cross-origin restrictions - use fallback height
                        iframe.style.height = '1400px';
                    }
                };
            } catch (e) {
                // Fallback if iframe resizing fails
                iframe.style.height = '1400px';
            }
        }

        function showProvider(provider) {
            // Update tab states
            providerTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.provider === provider);
            });


            // Load provider in iframe
            const iframe = document.createElement('iframe');
            iframe.src = providerUrls[provider];
            iframe.className = 'creator-frame';
            iframe.title = `${provider} Course Creator`;

            // Auto-resize iframe based on content
            resizeIframe(iframe);

            // Clear container and add iframe
            creatorContainer.innerHTML = '';
            creatorContainer.appendChild(iframe);

            // Store selection
            localStorage.setItem('lastCourseProvider', provider);
        }

        // Add click listeners
        providerTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const provider = tab.dataset.provider;
                showProvider(provider);
            });
        });

        // Restore last selection
        const lastProvider = localStorage.getItem('lastCourseProvider');
        if (lastProvider && providerUrls[lastProvider]) {
            showProvider(lastProvider);
        }
    </script>
</body>
</html>
