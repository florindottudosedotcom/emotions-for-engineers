<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#ffffff" stroke-width="1"/>

  <!-- AI/Creator icon - simplified gear/brain hybrid -->
  <g fill="#ffffff">
    <!-- Center circle -->
    <circle cx="16" cy="16" r="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Gear teeth -->
    <rect x="15" y="6" width="2" height="4" rx="1"/>
    <rect x="15" y="22" width="2" height="4" rx="1"/>
    <rect x="6" y="15" width="4" height="2" rx="1"/>
    <rect x="22" y="15" width="4" height="2" rx="1"/>

    <!-- Diagonal elements -->
    <rect x="22.5" y="8.5" width="2" height="3" rx="1" transform="rotate(45 23.5 10)"/>
    <rect x="7.5" y="20.5" width="2" height="3" rx="1" transform="rotate(45 8.5 22)"/>
    <rect x="7.5" y="8.5" width="2" height="3" rx="1" transform="rotate(-45 8.5 10)"/>
    <rect x="22.5" y="20.5" width="2" height="3" rx="1" transform="rotate(-45 23.5 22)"/>

    <!-- Center dot -->
    <circle cx="16" cy="16" r="2" fill="#ffffff"/>
  </g>
</svg>