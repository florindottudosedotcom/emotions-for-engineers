<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Slides Creator Launcher</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: var(--primary-color);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .redirect-message {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .countdown {
            font-size: 2em;
            margin: 20px 0;
        }
        a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>⚡ Slides Creator has been upgraded!</h1>
        <p>You're being redirected to the new provider selection launcher...</p>
        <div class="countdown" id="countdown">3</div>
        <p>Or <a href="slides_creator_launcher.html">click here to go directly</a></p>
    </div>

    <script>
        let count = 3;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            count--;
            countdownElement.textContent = count;

            if (count <= 0) {
                clearInterval(timer);
                window.location.href = 'slides_creator_launcher.html';
            }
        }, 1000);
    </script>
</body>
</html>
