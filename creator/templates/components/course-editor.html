<!-- Course Details Form -->
<form id="course-form">
    <div class="card mb-6">
        <div class="card-header">
            <h3>Course Details</h3>
            <p class="text-secondary">Basic information about your course</p>
        </div>
        <div class="card-body">
            <div class="form-group mb-4">
                <label for="course-name" class="form-label">Course Name</label>
                <input type="text" id="course-name" name="course-name" placeholder="Course Name (Generated by AI)" title="Course Name - The main title of your course" class="form-input" required>
            </div>

            <div class="form-group mb-4">
                <label for="course-desc" class="form-label">Course Description</label>
                <textarea id="course-desc" name="course-desc" placeholder="Course Description - Brief overview for the main landing page (Generated by AI)" title="Course Description - Brief overview that will appear on the main landing page" class="form-textarea" required></textarea>
            </div>
        </div>
    </div>

    <!-- Chapter Content -->
    <div class="card mb-6">
        <div class="card-header">
            <h3>Chapter Content</h3>
            <p class="text-secondary">Edit and organize your course chapters</p>
        </div>
        <div class="card-body">
            <div id="chapter-tabs-container" class="tab-nav"></div>
            <div id="chapter-content-container"></div>

            <div class="card-actions">
                <button type="button" id="clear-form-btn" class="btn btn-danger ml-auto">⟲ Clear Form & Start New</button>
            </div>
        </div>
    </div>

    <!-- Language Selection (will be injected by LanguageSelector component) -->
    <div id="language-section"></div>
</form>
