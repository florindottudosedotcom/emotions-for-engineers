<div class="input-group course-generation-section">
    <select id="course-depth" name="course-depth" class="select-no-margin" title="Course Depth - Control content length and detail level">
        <option value="outline">📋 Outline Only (50-100 words/chapter)</option>
        <option value="brief">📝 Brief (200-400 words/chapter)</option>
        <option value="standard" selected>📚 Standard (500-800 words/chapter)</option>
        <option value="detailed">📖 Detailed (1000-1500 words/chapter)</option>
        <option value="comprehensive">📚📚 Comprehensive (2000+ words/chapter)</option>
    </select>
    <select id="num-chapters" name="num-chapters" class="select-no-margin" title="Number of Chapters - Select how many chapters your course should have">
        <option value="1">1 Chapter</option>
        <option value="2">2 Chapters</option>
        <option value="3">3 Chapters</option>
        <option value="4">4 Chapters</option>
        <option value="5" selected>5 Chapters</option>
        <option value="6">6 Chapters</option>
        <option value="7">7 Chapters</option>
        <option value="8">8 Chapters</option>
        <option value="9">9 Chapters</option>
        <option value="10">10 Chapters</option>
    </select>
    <button type="button" id="generate-course-btn" class="btn btn-secondary ml-4">⚡ Generate Entire Course</button>
</div>
<div id="generation-status" class="status-display mt-4"></div>
