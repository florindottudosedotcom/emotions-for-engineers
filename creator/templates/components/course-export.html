<!-- Generate & Download Section -->
<div class="card">
    <div class="card-header">
        <h3>Generate & Download</h3>
        <p class="text-secondary">Create and download your course files</p>
    </div>
    <div class="card-body">
        <button type="submit" class="btn btn-primary btn-lg">⟄ Generate Course Files</button>
        <div id="file-generation-status" class="status-display mt-4"></div>
    </div>
</div>

<div id="download-section" class="card mt-6">
    <div class="card-header">
        <h3>Downloads</h3>
        <p class="text-secondary">Your files have been generated. Download them below.</p>
    </div>
    <div class="card-body">
        <a id="download-zip" class="btn btn-primary btn-lg">↓ Download Course Files (.zip)</a>
    </div>
</div>
