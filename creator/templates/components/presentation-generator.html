<div class="input-group course-generation-section">
    <select id="num-slides" name="num-slides" class="select-no-margin" title="Number of Slides - Select how many slides your presentation should have">
        <option value="1">1 Slide</option>
        <option value="2">2 Slides</option>
        <option value="3">3 Slides</option>
        <option value="4">4 Slides</option>
        <option value="5">5 Slides</option>
        <option value="6">6 Slides</option>
        <option value="8" selected>8 Slides</option>
        <option value="10">10 Slides</option>
        <option value="12">12 Slides</option>
        <option value="15">15 Slides</option>
    </select>
    <button type="button" id="generate-slides-btn" class="btn btn-secondary ml-4"><i data-lucide="zap"></i> Generate Presentation</button>
</div>
<div id="generation-status" class="status-display mt-4"></div>
