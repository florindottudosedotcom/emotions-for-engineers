<!-- Export Section -->
<div class="card export-section-card">
    <div class="card-header">
        <h3>Export & Download</h3>
        <p class="text-secondary">Export your presentation with automatic translation to selected languages</p>
    </div>
    <div class="card-body">
        <div class="export-buttons-grid">
            <button type="button" id="export-pdf-btn" class="btn btn-primary">⟄ Export as PDF</button>
            <button type="button" id="export-pptx-btn" class="btn btn-primary">⟐ Export as PowerPoint</button>
            <button type="button" id="export-html-btn" class="btn btn-secondary">◰ Export as HTML</button>
            <button type="button" id="export-json-btn" class="btn btn-outline">{} Export Data</button>
        </div>
        <div id="export-status" class="status-display mt-4"></div>
    </div>
</div>
