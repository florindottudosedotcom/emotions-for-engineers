<!DOCTYPE html>
<html lang="en">
{{> page-head}}
<body class="creator-page {{bodyClass}}">
    <div class="container">
        {{> back-to-hub}}

        <header class="page-header">
            <div class="header-content">
                <h1 class="page-title">{{title}}</h1>
                <p class="page-subtitle">{{subtitle}}</p>
            </div>
            {{> ai-status}}
        </header>

        {{> provider-selector}}

        {{> provider-info}}

        {{> prompt-generator}}

        {{> course-generator}}

        {{> course-editor}}

        {{> course-export}}
    </div>

    <!-- JS Libraries -->
    <script src="./assets/js/jszip/3.10.1/jszip.min.js"></script>
    <script src="./assets/js/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- Provider Configuration -->
    <script>
        window.COURSE_CREATOR_PROVIDER = '{{provider}}';
        window.CREATOR_TYPE = 'course';

        // Prevent FOUC by showing content after CSS is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a moment for CSS to be applied, then show content
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 100);
        });
    </script>

    <!-- Main Application Logic -->
    <script type="module">
        import { initializeCourseCreator } from './assets/js/course-creator.js';

        // Initialize the course creator with provider configuration
        window.addEventListener('DOMContentLoaded', () => {
            initializeCourseCreator({
                provider: '{{provider}}',
                debug: window.location.hostname === 'localhost'
            });
        });
    </script>
</body>
</html>
