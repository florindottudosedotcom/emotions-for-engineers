<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Editor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/editor_iframe.css" />
    <style>
        /* Loading state styles */
        .editor-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #666;
            font-family: Arial, sans-serif;
            flex-direction: column;
            gap: 1rem;
        }
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #e3e3e3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="editor">
        <div class="editor-loading">
            <div class="loading-spinner"></div>
            <div>Loading editor...</div>
        </div>
    </div>

    <script type="module">
        import { loadEditorAssets } from './assets/js/utils/lazy-loader.js';

        async function initializeEditor() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let chapterId = urlParams.get('id');

                // Fallback if no ID provided
                if (!chapterId) {
                    chapterId = 'unknown-chapter';
                    console.warn('Editor: No chapter ID provided in URL parameters');
                }

                // Load editor assets
                await loadEditorAssets();

                // Wait for DOM to be fully ready
                await new Promise(resolve => {
                    if (document.readyState === 'complete') {
                        resolve();
                    } else {
                        window.addEventListener('load', resolve, { once: true });
                    }
                });

                // Add small delay to ensure DOM is stable
                await new Promise(resolve => setTimeout(resolve, 100));

                // Clear loading state
                const editorContainer = document.querySelector('#editor');
                editorContainer.innerHTML = '';

                // Set iframe-specific document properties for better compatibility
                if (window.parent !== window) {
                    // We're in an iframe - set up iframe-specific properties
                    try {
                        document.domain = document.domain; // Synchronize domain
                    } catch (domainError) {
                        console.debug('Domain synchronization not needed:', domainError);
                    }
                }

                // Detect system dark mode preference
                const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

                // Initialize ToastUI Editor with safer approach
                let editor;
                try {
                    editor = new toastui.Editor({
                        el: document.querySelector('#editor'),
                        height: '100%',
                        initialEditType: 'wysiwyg',
                        previewStyle: 'vertical',
                        theme: isDarkMode ? 'dark' : 'light',
                        initialValue: ' ',  // Single space to avoid DOM selection issues
                        events: {
                            change: () => {
                                try {
                                    if (editor && editor.getMarkdown) {
                                        const content = editor.getMarkdown();
                                        parent.postMessage({
                                            type: 'content-changed',
                                            content: content,
                                            id: chapterId
                                        }, '*');
                                    }
                                } catch (changeError) {
                                    console.warn('Editor change event error:', changeError);
                                }
                            }
                        }
                    });

                    // Wait for editor to be fully rendered before setting content
                    const setInitialContent = async () => {
                        // Wait for editor to be fully ready
                        let attempts = 0;
                        while (attempts < 10) {
                            try {
                                if (editor && editor.setMarkdown && editor.getMarkdown) {
                                    // Test if editor is really ready by trying to get content
                                    editor.getMarkdown();
                                    // If successful, set the initial content
                                    editor.setMarkdown('Start writing your chapter content here...');
                                    break;
                                }
                            } catch (testError) {
                                attempts++;
                                await new Promise(resolve => setTimeout(resolve, 100));
                                continue;
                            }
                            attempts++;
                            await new Promise(resolve => setTimeout(resolve, 100));
                        }

                        if (attempts >= 10) {
                            console.warn('Editor took too long to initialize, using fallback');
                        }
                    };

                    // Start setting initial content after a brief delay
                    setTimeout(setInitialContent, 200);

                } catch (editorInitError) {
                    console.error('Editor initialization failed:', editorInitError);
                    // Create a fallback textarea if ToastUI fails
                    const editorContainer = document.querySelector('#editor');
                    editorContainer.innerHTML = `
                        <textarea
                            style="width: 100%; height: 100%; border: 1px solid #ccc; padding: 10px; font-family: monospace;"
                            placeholder="Start writing your chapter content here..."
                        ></textarea>
                    `;
                }

                console.log(`ToastUI Editor initialized successfully for chapter: ${chapterId}`);

                // Listen for system theme changes and update editor accordingly
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    const editorEl = document.querySelector('.toastui-editor-defaultUI');
                    if (editorEl) {
                        if (e.matches) {
                            editorEl.classList.add('toastui-editor-dark');
                        } else {
                            editorEl.classList.remove('toastui-editor-dark');
                        }
                    }
                });

                // Apply initial dark class if needed
                if (isDarkMode) {
                    setTimeout(() => {
                        const editorEl = document.querySelector('.toastui-editor-defaultUI');
                        if (editorEl) {
                            editorEl.classList.add('toastui-editor-dark');
                        }
                    }, 100);
                }

                // Listen for content updates from parent
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'set-content') {
                        try {
                            if (editor && editor.setMarkdown) {
                                editor.setMarkdown(event.data.content || 'Start writing your chapter content here...');
                            }
                        } catch (setContentError) {
                            console.warn('Failed to set editor content:', setContentError);
                        }
                    } else if (event.data.type === 'init') {
                        if (event.data.id) {
                            chapterId = event.data.id;
                        }
                    }
                });

                // Notify parent that editor is ready (even if there were initialization issues)
                setTimeout(() => {
                    parent.postMessage({
                        type: 'editor-ready',
                        id: chapterId
                    }, '*');
                }, 300);

                console.log(`Editor initialized successfully for chapter: ${chapterId}`);

            } catch (error) {
                console.error('Failed to initialize editor:', error);
                const editorContainer = document.querySelector('#editor');
                editorContainer.innerHTML = `
                    <div class="editor-loading">
                        <div style="color: #e74c3c;">⚠️ Failed to load editor</div>
                        <div style="font-size: 0.8em; color: #666;">Error: ${error.message}</div>
                        <button onclick="location.reload()" style="margin-top: 8px; padding: 4px 8px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            🔄 Retry
                        </button>
                    </div>
                `;
            }
        }

        // Initialize editor when page loads
        initializeEditor();
    </script>
</body>
</html>
