<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.run https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; connect-src 'self' https://huggingface.co https://raw.githubusercontent.com https://cdn-lfs-us-1.hf.co https://esm.run https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;">
    <title>Course Creator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Preload only immediately used assets -->
    <link rel="preload" href="./assets/js/main.js" as="script">

    <!-- Load CSS bundle -->
    <link rel="stylesheet" href="./assets/css/bundle.min.css" />
</head>
<body>
    <div id="overwrite-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Overwrite Existing Content?</h2>
            <p>There are chapters with content present. Do you want to remove them before generating new content?</p>
            <div class="input-group margin-top-1-5rem">
                <button type="button" id="overwrite-yes-btn" class="btn btn-primary">✓ Yes, Overwrite</button>
                <button type="button" id="overwrite-cancel-btn" class="btn btn-danger margin-left-auto">× Cancel</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="ai-status" class="ai-status-initial"></div>

        <!-- Provider-specific section will be injected here -->
        <div id="provider-section"></div>

        <div class="prompt-header">
            <button type="button" id="enhance-prompt-btn" class="btn btn-ai" title="Enhance and expand your prompt with AI assistance">✦ Enhance Prompt</button>
        </div>
        <textarea id="master-prompt" placeholder="Course Prompt - e.g., 'Create a comprehensive course about the history of ancient Rome, from its founding to the fall of the Western Empire.'" title="Course Prompt - Describe the course you want to create" class="prompt-textarea-large"></textarea>

            <div class="input-group course-generation-section">
                <select id="num-chapters" class="select-no-margin" title="Number of Chapters - Select how many chapters your course should have">
                    <option value="1">1 Chapter</option>
                    <option value="2">2 Chapters</option>
                    <option value="3">3 Chapters</option>
                    <option value="4">4 Chapters</option>
                    <option value="5" selected>5 Chapters</option>
                    <option value="6">6 Chapters</option>
                    <option value="7">7 Chapters</option>
                    <option value="8">8 Chapters</option>
                    <option value="9">9 Chapters</option>
                    <option value="10">10 Chapters</option>
                </select>
                <button type="button" id="generate-course-btn" class="btn btn-secondary margin-left-1rem">⚡ Generate Entire Course</button>
            </div>
            <div id="generation-status" class="status-display"></div>
        </fieldset>

        <hr class="hr-margin">

        <form id="course-form">
            <input type="text" id="course-name" placeholder="Course Name (Generated by AI)" title="Course Name - The main title of your course" required>

            <textarea id="course-desc" placeholder="Course Description - Brief overview for the main landing page (Generated by AI)" title="Course Description - Brief overview that will appear on the main landing page" required></textarea>

            <div id="chapter-tabs-container" class="tab-nav"></div>
            <div id="chapter-content-container"></div>

            <div class="input-group">
                <button type="button" id="clear-form-btn" class="btn btn-danger margin-left-auto">⟲ Clear Form & Start New</button>
            </div>

            <fieldset class="margin-top-2rem">
                <legend>Course Languages</legend>
                <div class="lang-grid">
                    <div class="lang-item" title="English"><input type="checkbox" id="lang-en" value="en" data-name="English" checked><img src="./assets/images/png/us.png" alt="USA Flag" class="flag-icon"><label for="lang-en" class="label-flex-grow">⭐ English</label></div>
                    <div class="lang-item" title="German"><input type="checkbox" id="lang-de" value="de" data-name="German"><img src="./assets/images/png/de.png" alt="German Flag" class="flag-icon"><label for="lang-de" class="label-flex-grow">German</label></div>
                    <div class="lang-item" title="Mandarin Chinese"><input type="checkbox" id="lang-zh" value="zh" data-name="Mandarin Chinese"><img src="./assets/images/png/cn.png" alt="Chinese Flag" class="flag-icon"><label for="lang-zh" class="label-flex-grow">Mandarin Chinese</label></div>
                    <div class="lang-item" title="Spanish"><input type="checkbox" id="lang-es" value="es" data-name="Spanish"><img src="./assets/images/png/es.png" alt="Spanish Flag" class="flag-icon"><label for="lang-es" class="label-flex-grow">Spanish</label></div>
                    <div class="lang-item" title="Hindi"><input type="checkbox" id="lang-hi" value="hi" data-name="Hindi"><img src="./assets/images/png/in.png" alt="Indian Flag" class="flag-icon"><label for="lang-hi" class="label-flex-grow">Hindi</label></div>
                    <div class="lang-item" title="Portuguese"><input type="checkbox" id="lang-pt" value="pt" data-name="Portuguese"><img src="./assets/images/png/pt.png" alt="Portuguese Flag" class="flag-icon"><label for="lang-pt" class="label-flex-grow">Portuguese</label></div>
                    <div class="lang-item" title="Russian"><input type="checkbox" id="lang-ru" value="ru" data-name="Russian"><img src="./assets/images/png/ru.png" alt="Russian Flag" class="flag-icon"><label for="lang-ru" class="label-flex-grow">Russian</label></div>
                    <div class="lang-item" title="Japanese"><input type="checkbox" id="lang-ja" value="ja" data-name="Japanese"><img src="./assets/images/png/jp.png" alt="Japanese Flag" class="flag-icon"><label for="lang-ja" class="label-flex-grow">Japanese</label></div>
                    <div class="lang-item" title="French"><input type="checkbox" id="lang-fr" value="fr" data-name="French"><img src="./assets/images/png/fr.png" alt="French Flag" class="flag-icon"><label for="lang-fr" class="label-flex-grow">French</label></div>
                    <div class="lang-item" title="Italian"><input type="checkbox" id="lang-it" value="it" data-name="Italian"><img src="./assets/images/png/it.png" alt="Italian Flag" class="flag-icon"><label for="lang-it" class="label-flex-grow">Italian</label></div>
                    <div class="lang-item" title="Romanian"><input type="checkbox" id="lang-ro" value="ro" data-name="Romanian"><img src="./assets/images/png/ro.png" alt="Romanian Flag" class="flag-icon"><label for="lang-ro" class="label-flex-grow">Romanian</label></div>
                </div>
            </fieldset>

            <hr class="hr-margin">
            <button type="submit" class="btn btn-primary">⟄ Generate Course Files</button>
            <div id="file-generation-status" class="status-display"></div>
        </form>

        <div id="download-section">
            <h3>Downloads</h3>
            <p>Your files have been generated. Download them below.</p>
            <a id="download-zip" class="btn btn-primary">↓ Download Course Files (.zip)</a>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="./assets/js/jszip/3.10.1/jszip.min.js"></script>
    <script src="./assets/js/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- Main Application Logic -->
    <script>
        // Configure provider type
        window.COURSE_CREATOR_PROVIDER = 'webllm';
    </script>
    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
