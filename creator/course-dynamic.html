<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Creator - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .loading {
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h1>Loading Course Creator</h1>
        <p>Detecting provider and initializing interface...</p>
    </div>

    <script type="module">
        import { CreatorRouter } from './assets/js/core/CreatorRouter.js';

        // Initialize the dynamic course creator
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const router = new CreatorRouter();
                await router.loadCourseCreator();
            } catch (error) {
                console.error('Failed to load course creator:', error);
                document.body.innerHTML = `
                    <div class="loading">
                        <h1>Error Loading Course Creator</h1>
                        <p>Failed to initialize: ${error.message}</p>
                        <p><a href="index.html" style="color: white;">← Back to Creator Hub</a></p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
